<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارتابل زائرین">
<link rel="manifest" href="manifest.json">
<title>کارتابل زائر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>کارتابل زائر</h1>
      <button class="btn btn-ghost" onclick="logout()">خروج</button>
    </div>

    <div class="date-bar" id="dateBar"></div>

    <div class="card">
      <div class="profile-card">
        <div id="photoBox"></div>
        <div class="profile-info">
          <h2 id="fullName">—</h2>
          <dl>
            <dt>🆔 کد زائر</dt><dd id="pCode">—</dd>
            <dt>📅 تاریخ تولد</dt><dd id="pBirth">—</dd>
            <dt>📱 شماره موبایل</dt><dd id="pMobile">—</dd>
            <dt>📘 شماره گذرنامه</dt><dd id="pPassport">—</dd>
            <dt>🚌 اتوبوس مکه</dt><dd id="busMakkah">—</dd>
            <dt>🚌 اتوبوس مدینه</dt><dd id="busMadinah">—</dd>
          </dl>
        </div>
      </div>

      <div class="extra-details" id="extraDetails">
        <dl class="profile-info" style="display:grid; grid-template-columns:auto auto; gap:5px 14px;">
          <dt>🎓 تحصیلات</dt><dd id="eEducation">—</dd>
          <dt>🏙️ شهر محل تولد</dt><dd id="eBirthCity">—</dd>
          <dt>🩸 گروه خونی</dt><dd id="eBloodType">—</dd>
          <dt>💼 شغل</dt><dd id="eJob">—</dd>
          <dt>🕌 مرجع تقلید</dt><dd id="eMarja">—</dd>
          <dt>🎖️ ایثارگری</dt><dd id="eVeteran">—</dd>
        </dl>
      </div>

      <div class="actions-row">
        <button class="btn btn-secondary" id="toggleDetailsBtn" style="width:auto;">مشاهده جزئیات</button>
      </div>
    </div>

    <div class="menu-grid">
      <a class="menu-card" href="visa.html">
        <span class="icon">🛂</span>
        <span class="title">مشاهده ویزا</span>
      </a>
      <a class="menu-card" href="passport.html">
        <span class="icon">📘</span>
        <span class="title">مشاهده گذرنامه</span>
      </a>
      <a class="menu-card" href="room.html?city=madinah">
        <span class="icon">🕌</span>
        <span class="title">هتل مدینه</span>
      </a>
      <a class="menu-card" href="room.html?city=makkah">
        <span class="icon">🕋</span>
        <span class="title">هتل مکه</span>
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>applyPortalBackground();</script>
  <script>
    const session = requireSession();
    redirectIfAdmin();

    document.getElementById('dateBar').innerHTML = todayDatesHtml();

    document.getElementById('fullName').textContent = `${session.firstName || ''} ${session.lastName || ''}`.trim() || 'زائر گرامی';
    document.getElementById('pCode').textContent = session.code || '—';
    document.getElementById('pBirth').textContent = session.birthDate || '—';
    document.getElementById('pMobile').textContent = formatMobile(session.mobile);
    document.getElementById('pPassport').textContent = session.passportNumber || '—';
    document.getElementById('busMakkah').textContent = session.busMakkah || '—';
    document.getElementById('busMadinah').textContent = session.busMadinah || '—';

    document.getElementById('eEducation').textContent = session.education || '—';
    document.getElementById('eBirthCity').textContent = session.birthCity || '—';
    document.getElementById('eBloodType').textContent = session.bloodType || '—';
    document.getElementById('eJob').textContent = session.job || '—';
    document.getElementById('eMarja').textContent = session.marja || '—';
    document.getElementById('eVeteran').textContent = session.veteran || '—';

    document.getElementById('photoBox').innerHTML = avatarOrFallbackHtml(session.code, 'lg');

    const extra = document.getElementById('extraDetails');
    const toggleBtn = document.getElementById('toggleDetailsBtn');
    toggleBtn.onclick = () => {
      extra.classList.toggle('show');
      toggleBtn.textContent = extra.classList.contains('show') ? 'بستن' : 'مشاهده جزئیات';
    };
  </script>
</body>
</html>
