<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e2323">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارتابل زائرین">
<link rel="manifest" href="manifest.json">
<title>اطلاعات هتل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>اطلاعات هتل</h1>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="history.back()">بازگشت</button>
        <button class="btn btn-ghost" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="card" id="content">
      <div class="spinner-text">در حال بارگذاری...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>applyPortalBackground();</script>
  <script>
    requireSession();
    const params = new URLSearchParams(location.search);
    const city = params.get('city') === 'makkah' ? 'makkah' : 'madinah';

    function galleryImagePlaceholder(city, index) {
      const id = 'gp_' + city + '_' + index;
      loadGalleryImageAsync(id, city, index);
      return `<div class="muted" id="${id}" style="background:var(--input-bg); border-radius:12px; height:140px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border);">در حال بارگذاری...</div>`;
    }

    async function loadGalleryImageAsync(id, city, index) {
      try {
        const result = await fetchHotelImageData(city, index);
        const el = document.getElementById(id);
        if (result.ok && el) {
          const img = document.createElement('img');
          img.src = base64ToBlobUrl(result.base64, result.mimeType);
          img.alt = 'عکس هتل';
          el.replaceWith(img);
        } else if (el) {
          el.textContent = 'خطا در بارگذاری تصویر';
        }
      } catch (e) {}
    }

    async function load() {
      const data = await api('hotelInfo', { city });
      const content = document.getElementById('content');
      if (!data.ok) {
        content.innerHTML = `<div class="muted">${data.message}</div>`;
        return;
      }
      let gallery = '';
      if (data.photoCount > 0) {
        const imgs = Array.from({ length: data.photoCount }, (_, i) => galleryImagePlaceholder(city, i)).join('');
        gallery = `<div class="gallery">${imgs}</div>`;
      } else {
        gallery = '<div class="muted" style="margin-top:14px;">عکسی برای این هتل ثبت نشده است</div>';
      }

      content.innerHTML = `
        <h2>${data.name}</h2>
        <iframe class="map-frame" src="${data.mapEmbed}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        ${gallery}`;
    }
    load();
  </script>
</body>
</html>
