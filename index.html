<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارتابل زائرین">
<link rel="manifest" href="manifest.json">
<title>ورود به کارتابل زائرین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-page center-page-bottom">
    <div class="card login-card login-card-glass">
      <form id="loginForm">
        <div class="field">
          <label for="code">کد زائر</label>
          <input class="input" id="code" placeholder="کد زائر" inputmode="numeric" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="national">کد ملی</label>
          <input class="input" id="national" placeholder="کد ملی ۱۰ رقمی" inputmode="numeric" autocomplete="off" required>
        </div>
        <button class="btn btn-primary" type="submit" id="submitBtn">ورود به کارتابل</button>
      </form>
      <div class="error-box" id="errorBox"></div>
      <div class="footer-note">🤲 التماس دعا</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    clearSession();
    if (CONFIG.LOGIN_BG_URL) {
      document.querySelector('.center-page').style.backgroundImage = `url('${CONFIG.LOGIN_BG_URL}')`;
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      hideError(errorBox);
      const code = document.getElementById('code').value.trim();
      const national = document.getElementById('national').value.trim();
      if (!code || !national) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال بررسی...';
      try {
        const result = await api('login', { code, national });
        if (!result.ok) {
          showError(errorBox, result.message || 'ورود ناموفق بود');
        } else {
          saveSession(Object.assign({ role: result.role, token: result.token }, result.data || { code }));
          location.href = result.role === 'admin' ? 'admin.html' : 'dashboard.html';
        }
      } catch (e) {
        showError(errorBox, 'خطا در ارتباط با سرور. آدرس SCRIPT_URL را در config.js بررسی کنید.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ورود به کارتابل';
      }
    });
  </script>
</body>
</html>
