<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارتابل زائرین">
<link rel="manifest" href="manifest.json">
<title>مشاهده گذرنامه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>مشاهده گذرنامه</h1>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="history.back()">بازگشت</button>
        <button class="btn btn-ghost" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar" id="adminToolbar" style="display:none;">
        <div class="field">
          <label for="codeInput">کد زائر</label>
          <input class="input" id="codeInput" inputmode="numeric" placeholder="مثلاً 45">
        </div>
        <button class="btn btn-secondary" id="showBtn">نمایش</button>
      </div>

      <div id="viewerArea"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const session = requireSession();
    const viewerArea = document.getElementById('viewerArea');
    const TYPE = 'passport';
    const TYPE_LABEL = 'گذرنامه';

    function render(code) {
      const rawUrl = fileUrl(TYPE, code);
      const viewerSrc = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(rawUrl);
      viewerArea.innerHTML = `
        <iframe class="viewer-frame" src="${viewerSrc}"></iframe>
        <div class="actions-row">
          <a class="btn btn-primary" style="width:auto; display:inline-flex;" href="${rawUrl}" target="_blank" rel="noopener">باز کردن / دانلود ${TYPE_LABEL}</a>
        </div>
        <p class="muted" style="margin-top:10px;">اگر پیش‌نمایش بالا خالی ماند، یعنی فایلی برای این کد پیدا نشد؛ با دکمه بالا هم می‌توانید مستقیم بررسی کنید.</p>`;
    }

    if (session.role === 'admin') {
      document.getElementById('adminToolbar').style.display = 'flex';
      document.getElementById('showBtn').onclick = () => {
        const code = document.getElementById('codeInput').value.trim();
        if (code) render(code);
      };
      viewerArea.innerHTML = '<div class="spinner-text">کد زائر مورد نظر را وارد و «نمایش» را بزنید</div>';
    } else {
      render(session.code);
    }
  </script>
</body>
</html>
